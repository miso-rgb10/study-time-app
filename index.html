<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習時間アプリ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: #f5f7fb;
  color: #222;
}

header {
  background: #4f7cff;
  color: white;
  padding: 24px 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

.container {
  max-width: 700px;
  margin: 20px auto;
  padding: 0 15px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2 {
  margin-top: 0;
  font-size: 20px;
}

input,
select,
button {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 16px;
}

button {
  border: none;
  background: #4f7cff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

button:disabled {
  opacity: 0.6;
}

.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.summary-box {
  background: #f0f4ff;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
}

.summary-number {
  font-size: 25px;
  font-weight: bold;
  margin-top: 5px;
}

.record {
  border-bottom: 1px solid #eee;
  padding: 12px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.record:last-child {
  border-bottom: none;
}

.record-info {
  flex: 1;
}

.record-date {
  font-size: 13px;
  color: #888;
  margin-top: 4px;
}

.delete {
  width: auto;
  padding: 7px 10px;
  background: #e74c3c;
  font-size: 13px;
  margin: 0;
}

.bar {
  margin: 12px 0;
}

.bar-label {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}

.bar-background {
  height: 18px;
  background: #e9edf5;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 5px;
}

.bar-fill {
  height: 100%;
  background: #4f7cff;
  border-radius: 10px;
}

.empty {
  text-align: center;
  color: #888;
  padding: 20px;
}

.online {
  margin-top: 10px;
  font-weight: bold;
  color: #2e8b57;
}


/* =========================
   タイマー
========================= */

.timer-box {
  text-align: center;
  background: #f0f4ff;
  border-radius: 16px;
  padding: 20px;
  margin-top: 15px;
}

.timer-display {
  font-size: 42px;
  font-weight: bold;
  letter-spacing: 2px;
  margin: 15px 0;
}

.timer-status {
  font-size: 14px;
  color: #777;
  margin-bottom: 10px;
}

.start-button {
  background: #2e8b57;
}

.stop-button {
  background: #e74c3c;
}


/* =========================
   ランキング
========================= */

.ranking-card {
  background: linear-gradient(
    135deg,
    #fff9e6,
    #ffffff
  );
}

.ranking-title {
  text-align: center;
  margin-bottom: 15px;
}

.ranking-subtitle {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-top: -8px;
  margin-bottom: 15px;
}

.ranking-table {
  width: 100%;
  border-collapse: collapse;
}

.ranking-table th {
  background: #f0f4ff;
  padding: 10px 6px;
  font-size: 13px;
  text-align: center;
}

.ranking-table td {
  padding: 12px 6px;
  border-bottom: 1px solid #eee;
  text-align: center;
}

.ranking-table tr:last-child td {
  border-bottom: none;
}

.ranking-number {
  font-size: 20px;
  font-weight: bold;
}

.ranking-name {
  text-align: left !important;
  font-weight: bold;
}

.ranking-minutes {
  font-weight: bold;
}

.ranking-section {
  margin-bottom: 25px;
}

.ranking-section:last-child {
  margin-bottom: 0;
}

.ranking-divider {
  border: none;
  border-top: 1px solid #ddd;
  margin: 25px 0;
}

.my-rank {
  background: #f0f4ff;
}

.ranking-loading {
  text-align: center;
  color: #888;
  padding: 20px;
}

@media (max-width: 500px) {

  header h1 {
    font-size: 22px;
  }

  .card {
    padding: 16px;
  }

  .summary {
    grid-template-columns: 1fr 1fr;
  }

  .timer-display {
    font-size: 34px;
  }

  .ranking-table th,
  .ranking-table td {
    padding: 9px 4px;
    font-size: 13px;
  }

  .ranking-number {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<header>
  <h1>📚 学習時間</h1>
  <p>毎日の勉強を記録しよう！</p>
</header>

<div class="container">


  <!-- =========================
       ログイン
  ========================= -->

  <div class="card">

    <h2>🔐 ログイン</h2>

    <button
      id="loginButton"
      onclick="loginWithGoogle()"
    >
      Googleでログイン
    </button>

    <p id="loginStatus">
      ログインしていません
    </p>

    <p
      id="onlineCount"
      class="online"
    >
      🟢 現在ログイン中：0人
    </p>

  </div>


  <!-- =========================
       ランキング
  ========================= -->

  <div class="card ranking-card">

    <h2 class="ranking-title">
      🏆 クラス学習ランキング
    </h2>

    <div id="rankingContent">

      <div class="ranking-loading">
        ログインするとランキングが表示されます
      </div>

    </div>

  </div>


  <!-- =========================
       リアルタイムタイマー
  ========================= -->

  <div class="card">

    <h2>⏱️ リアルタイム勉強タイマー</h2>

    <label>科目</label>

    <select id="timerSubject">

      <option value="国語">国語</option>
      <option value="数学">数学</option>
      <option value="英語">英語</option>
      <option value="理科">理科</option>
      <option value="社会">社会</option>
      <option value="その他">その他</option>

    </select>

    <div class="timer-box">

      <div
        id="timerStatus"
        class="timer-status"
      >
        準備OK
      </div>

      <div
        id="timerDisplay"
        class="timer-display"
      >
        00:00:00
      </div>

      <button
        id="startTimerButton"
        class="start-button"
        onclick="startTimer()"
      >
        ▶️ 勉強開始
      </button>

      <button
        id="stopTimerButton"
        class="stop-button"
        onclick="stopTimer()"
        style="display:none;"
      >
        ⏹️ 勉強終了
      </button>

    </div>

  </div>


  <!-- =========================
       手入力記録
  ========================= -->

  <div class="card">

    <h2>📝 勉強時間を記録</h2>

    <label>科目</label>

    <select id="subject">

      <option value="国語">国語</option>
      <option value="数学">数学</option>
      <option value="英語">英語</option>
      <option value="理科">理科</option>
      <option value="社会">社会</option>
      <option value="その他">その他</option>

    </select>

    <label>勉強時間（分）</label>

    <input
      type="number"
      id="minutes"
      min="1"
      placeholder="例：60"
    >

    <button onclick="addRecord()">
      記録する
    </button>

  </div>


  <!-- =========================
       今日のまとめ
  ========================= -->

  <div class="card">

    <h2>📊 今日のまとめ</h2>

    <div class="summary">

      <div class="summary-box">

        今日の時間

        <div
          class="summary-number"
          id="todayTotal"
        >
          0分
        </div>

      </div>

      <div class="summary-box">

        記録数

        <div
          class="summary-number"
          id="recordCount"
        >
          0
        </div>

      </div>

    </div>

  </div>


  <!-- =========================
       科目別
  ========================= -->

  <div class="card">

    <h2>📈 科目別</h2>

    <div id="subjectChart"></div>

  </div>


  <!-- =========================
       記録一覧
  ========================= -->

  <div class="card">

    <h2>📅 記録一覧</h2>

    <div id="records">

      <div class="empty">
        ログインすると記録が表示されます
      </div>

    </div>

  </div>


  <!-- =========================
       削除
  ========================= -->

  <div class="card">

    <button
      onclick="clearAll()"
      style="background:#777;"
    >
      すべての記録を削除
    </button>

  </div>

</div>


<script type="module">


/* =========================
   Firebase
========================= */

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  doc,
  setDoc,
  deleteDoc,
  query,
  where,
  onSnapshot,
  getDocs
}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
  getAuth,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged
}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================
   Firebase設定
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCJH9rm_ygt9xbuIDdZDuAXEgy_Rsdlxz4",

  authDomain:
    "studytime11111-9c9f1.firebaseapp.com",

  projectId:
    "studytime11111-9c9f1",

  storageBucket:
    "studytime11111-9c9f1.firebasestorage.app",

  messagingSenderId:
    "292063415300",

  appId:
    "1:292063415300:web:3cbf0aef215710ecfd3951"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const auth =
  getAuth(app);

const provider =
  new GoogleAuthProvider();


/* =========================
   クラスID
========================= */

const CLASS_ID =
  "z6bxH8sYFjcdfENFXn3K";


/* =========================
   タイマー用変数
========================= */

let timerInterval = null;

let timerStartTime = null;


/* =========================
   ランキング用変数
========================= */

let classStudents = [];

let classSessions = [];

let rankingStudentsUnsubscribe = null;

let rankingSessionsUnsubscribe = null;


/* =========================
   Googleログイン
========================= */

window.loginWithGoogle =
  async function () {

    try {

      await signInWithRedirect(
        auth,
        provider
      );

    } catch (error) {

      console.error(error);

      alert(
        "Googleログインに失敗しました。\n" +
        error.code +
        "\n" +
        error.message
      );

    }

  };


/* =========================
   タイマー表示
========================= */

function updateTimerDisplay() {

  if (!timerStartTime) {
    return;
  }

  const elapsed =
    Math.floor(
      (Date.now() - timerStartTime) / 1000
    );

  const hours =
    Math.floor(elapsed / 3600);

  const minutes =
    Math.floor(
      (elapsed % 3600) / 60
    );

  const seconds =
    elapsed % 60;

  const displayHours =
    String(hours).padStart(2, "0");

  const displayMinutes =
    String(minutes).padStart(2, "0");

  const displaySeconds =
    String(seconds).padStart(2, "0");

  document.getElementById(
    "timerDisplay"
  ).textContent =
    displayHours +
    ":" +
    displayMinutes +
    ":" +
    displaySeconds;

}


/* =========================
   タイマー開始
========================= */

window.startTimer =
  function () {

    const user =
      auth.currentUser;

    if (!user) {

      alert(
        "先にGoogleログインしてください！"
      );

      return;

    }

    timerStartTime =
      Date.now();

    document.getElementById(
      "timerStatus"
    ).textContent =
      "🔴 勉強中";

    document.getElementById(
      "startTimerButton"
    ).style.display =
      "none";

    document.getElementById(
      "stopTimerButton"
    ).style.display =
      "block";

    updateTimerDisplay();

    timerInterval =
      setInterval(
        updateTimerDisplay,
        1000
      );

  };


/* =========================
   タイマー終了
========================= */

window.stopTimer =
  async function () {

    if (!timerStartTime) {
      return;
    }

    const user =
      auth.currentUser;

    if (!user) {

      alert(
        "ログイン状態を確認してください！"
      );

      return;

    }

    const elapsedSeconds =
      Math.floor(
        (Date.now() - timerStartTime) / 1000
      );

    clearInterval(
      timerInterval
    );

    timerInterval =
      null;

    timerStartTime =
      null;

    document.getElementById(
      "timerStatus"
    ).textContent =
      "保存中...";

    const minutes =
      Math.max(
        1,
        Math.round(
          elapsedSeconds / 60
        )
      );

    const subject =
      document.getElementById(
        "timerSubject"
      ).value;

    try {

      await addDoc(

        collection(
          db,
          "studySessions"
        ),

        {

          studentId:
            user.uid,

          subject:
            subject,

          minutes:
            minutes,

          date:
            serverTimestamp()

        }

      );

      document.getElementById(
        "timerDisplay"
      ).textContent =
        "00:00:00";

      document.getElementById(
        "timerStatus"
      ).textContent =
        "✅ " +
        minutes +
        "分を記録しました";

    } catch (error) {

      console.error(
        error
      );

      alert(
        "タイマー記録を保存できませんでした。\n" +
        error.code +
        "\n" +
        error.message
      );

      document.getElementById(
        "timerStatus"
      ).textContent =
        "保存に失敗しました";

    }

    document.getElementById(
      "startTimerButton"
    ).style.display =
      "block";

    document.getElementById(
      "stopTimerButton"
    ).style.display =
      "none";

  };


/* =========================
   自分の記録を表示
========================= */

function showRecords(snapshot) {

  const recordsElement =
    document.getElementById(
      "records"
    );

  const todayTotalElement =
    document.getElementById(
      "todayTotal"
    );

  const recordCountElement =
    document.getElementById(
      "recordCount"
    );

  const chartElement =
    document.getElementById(
      "subjectChart"
    );

  let records = [];

  snapshot.forEach((item) => {

    const data =
      item.data();

    records.push({

      id:
        item.id,

      subject:
        data.subject ||
        "その他",

      minutes:
        Number(data.minutes) ||
        0,

      date:
        data.date

    });

  });


  /* =========================
     新しい順
  ========================= */

  records.sort((a, b) => {

    const timeA =
      a.date &&
      a.date.toDate
        ? a.date.toDate().getTime()
        : 0;

    const timeB =
      b.date &&
      b.date.toDate
        ? b.date.toDate().getTime()
        : 0;

    return timeB - timeA;

  });


  /* =========================
     今日の合計
  ========================= */

  const now =
    new Date();

  let todayTotal =
    0;

  records.forEach((record) => {

    if (
      !record.date ||
      !record.date.toDate
    ) {
      return;
    }

    const date =
      record.date.toDate();

    if (

      date.getFullYear() ===
        now.getFullYear()

      &&

      date.getMonth() ===
        now.getMonth()

      &&

      date.getDate() ===
        now.getDate()

    ) {

      todayTotal +=
        record.minutes;

    }

  });

  todayTotalElement.textContent =
    todayTotal +
    "分";

  recordCountElement.textContent =
    records.length;


  /* =========================
     科目別集計
  ========================= */

  const subjects = {

    "国語": 0,
    "数学": 0,
    "英語": 0,
    "理科": 0,
    "社会": 0,
    "その他": 0

  };

  records.forEach((record) => {

    if (
      subjects[record.subject] !==
      undefined
    ) {

      subjects[record.subject] +=
        record.minutes;

    }

  });

  const maxMinutes =
    Math.max(
      ...Object.values(subjects),
      1
    );

  chartElement.innerHTML =
    "";

  Object.entries(subjects)
    .forEach(
      ([subject, minutes]) => {

        const bar =
          document.createElement(
            "div"
          );

        bar.className =
          "bar";

        const label =
          document.createElement(
            "div"
          );

        label.className =
          "bar-label";

        label.innerHTML =
          "<span>" +
          subject +
          "</span>" +
          "<span>" +
          minutes +
          "分</span>";

        const background =
          document.createElement(
            "div"
          );

        background.className =
          "bar-background";

        const fill =
          document.createElement(
            "div"
          );

        fill.className =
          "bar-fill";

        fill.style.width =
          (
            minutes /
            maxMinutes *
            100
          ) +
          "%";

        background.appendChild(
          fill
        );

        bar.appendChild(
          label
        );

        bar.appendChild(
          background
        );

        chartElement.appendChild(
          bar
        );

      }
    );


  /* =========================
     記録一覧
  ========================= */

  recordsElement.innerHTML =
    "";

  if (
    records.length === 0
  ) {

    recordsElement.innerHTML =
      '<div class="empty">' +
      'まだ記録がありません' +
      '</div>';

    return;

  }

  records.forEach((record) => {

    const recordElement =
      document.createElement(
        "div"
      );

    recordElement.className =
      "record";

    const info =
      document.createElement(
        "div"
      );

    info.className =
      "record-info";

    let dateText =
      "日時不明";

    if (
      record.date &&
      record.date.toDate
    ) {

      const date =
        record.date.toDate();

      dateText =
        date.toLocaleString(
          "ja-JP"
        );

    }

    info.innerHTML =
      "<strong>" +
      record.subject +
      "</strong>　" +
      record.minutes +
      "分" +
      '<div class="record-date">' +
      dateText +
      "</div>";

    const deleteButton =
      document.createElement(
        "button"
      );

    deleteButton.textContent =
      "削除";

    deleteButton.className =
      "delete";

    deleteButton.onclick =
      () =>
        deleteRecord(
          record.id
        );

    recordElement.appendChild(
      info
    );

    recordElement.appendChild(
      deleteButton
    );

    recordsElement.appendChild(
      recordElement
    );

  });

}


/* =========================
   自分の記録を
   リアルタイム取得
========================= */

function listenToMyRecords(user) {

  const recordsQuery =
    query(

      collection(
        db,
        "studySessions"
      ),

      where(
        "studentId",
        "==",
        user.uid
      )

    );

  onSnapshot(

    recordsQuery,

    (snapshot) => {

      showRecords(
        snapshot
      );

    },

    (error) => {

      console.error(
        "記録読み込みエラー:",
        error
      );

    }

  );

}


/* =========================
   ランキング表示
========================= */

function updateRankings() {

  const rankingContent =
    document.getElementById(
      "rankingContent"
    );

  if (
    classStudents.length === 0
  ) {

    rankingContent.innerHTML =
      '<div class="ranking-loading">' +
      'クラスのメンバーがまだ登録されていません' +
      '</div>';

    return;

  }


  /* =========================
     今日の日付
  ========================= */

  const now =
    new Date();

  const todayYear =
    now.getFullYear();

  const todayMonth =
    now.getMonth();

  const todayDate =
    now.getDate();


  /* =========================
     学生ごとの集計
  ========================= */

  const rankingData =
    classStudents.map(
      (student) => {

        let todayMinutes = 0;

        let allTimeMinutes = 0;


        classSessions.forEach(
          (session) => {

            if (
              session.studentId !==
              student.id
            ) {
              return;
            }


            const minutes =
              Number(
                session.minutes
              ) || 0;


            allTimeMinutes +=
              minutes;


            if (
              session.date &&
              session.date.toDate
            ) {

              const date =
                session.date.toDate();


              if (

                date.getFullYear() ===
                  todayYear

                &&

                date.getMonth() ===
                  todayMonth

                &&

                date.getDate() ===
                  todayDate

              ) {

                todayMinutes +=
                  minutes;

              }

            }

          }
        );


        return {

          id:
            student.id,

          name:
            student.nickname ||
            "名前未設定",

          todayMinutes:
            todayMinutes,

          allTimeMinutes:
            allTimeMinutes

        };

      }
    );


  /* =========================
     今日ランキング
  ========================= */

  const todayRanking =
    [...rankingData].sort(
      (a, b) =>
        b.todayMinutes -
        a.todayMinutes
    );


  /* =========================
     全期間ランキング
  ========================= */

  const allTimeRanking =
    [...rankingData].sort(
      (a, b) =>
        b.allTimeMinutes -
        a.allTimeMinutes
    );


  /* =========================
     ランキングHTML
  ========================= */

  function createRankingTable(
    ranking,
    type
  ) {

    let html = "";

    html +=
      '<table class="ranking-table">';

    html +=
      "<thead>";

    html +=
      "<tr>";

    html +=
      "<th>順位</th>";

    html +=
      "<th>名前</th>";

    html +=
      "<th>勉強時間</th>";

    html +=
      "</tr>";

    html +=
      "</thead>";

    html +=
      "<tbody>";


    ranking.forEach(
      (student, index) => {

        const rank =
          index + 1;


        let medal =
          "";

        if (rank === 1) {
          medal = "🥇";
        } else if (rank === 2) {
          medal = "🥈";
        } else if (rank === 3) {
          medal = "🥉";
        } else {
          medal = rank;
        }


        const user =
          auth.currentUser;


        const isMe =
          user &&
          user.uid ===
            student.id;


        const rowClass =
          isMe
            ? "my-rank"
            : "";


        const minutes =
          type === "today"
            ? student.todayMinutes
            : student.allTimeMinutes;


        html +=
          '<tr class="' +
          rowClass +
          '">';


        html +=
          '<td class="ranking-number">' +
          medal +
          "</td>";


        html +=
          '<td class="ranking-name">';


        if (isMe) {

          html +=
            "👤 " +
            escapeHtml(
              student.name
            ) +
            "（自分）";

        } else {

          html +=
            escapeHtml(
              student.name
            );

        }


        html +=
          "</td>";


        html +=
          '<td class="ranking-minutes">' +
          minutes +
          "分</td>";


        html +=
          "</tr>";

      }
    );


    html +=
      "</tbody>";

    html +=
      "</table>";


    return html;

  }


  rankingContent.innerHTML =

    '<div class="ranking-section">' +

      '<h3>🏆 今日のランキング</h3>' +

      '<p class="ranking-subtitle">' +
      '今日の勉強時間' +
      '</p>' +

      createRankingTable(
        todayRanking,
        "today"
      ) +

    "</div>" +

    '<hr class="ranking-divider">' +

    '<div class="ranking-section">' +

      '<h3>🌟 全期間ランキング</h3>' +

      '<p class="ranking-subtitle">' +
      'これまでに記録した合計時間' +
      '</p>' +

      createRankingTable(
        allTimeRanking,
        "all"
      ) +

    "</div>";

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


/* =========================
   クラスランキングを
   リアルタイム取得
========================= */

function listenToRankings(user) {

  /* =========================
     クラスメンバー
  ========================= */

  const studentsQuery =
    query(

      collection(
        db,
        "students"
      ),

      where(
        "classId",
        "==",
        CLASS_ID
      )

    );


  if (
    rankingStudentsUnsubscribe
  ) {

    rankingStudentsUnsubscribe();

  }


  rankingStudentsUnsubscribe =
    onSnapshot(

      studentsQuery,

      (snapshot) => {

        classStudents =
          [];


        snapshot.forEach(
          (item) => {

            const data =
              item.data();


            classStudents.push({

              id:
                item.id,

              nickname:
                data.nickname ||
                "名前未設定",

              classId:
                data.classId

            });

          }
        );


        updateRankings();

      },

      (error) => {

        console.error(
          "クラスメンバー取得エラー:",
          error
        );


        document.getElementById(
          "rankingContent"
        ).innerHTML =
          '<div class="ranking-loading">' +
          'ランキングを読み込めませんでした' +
          '</div>';

      }

    );


  /* =========================
     勉強記録
  ========================= */

  if (
    rankingSessionsUnsubscribe
  ) {

    rankingSessionsUnsubscribe();

  }


  rankingSessionsUnsubscribe =
    onSnapshot(

      collection(
        db,
        "studySessions"
      ),

      (snapshot) => {

        classSessions =
          [];


        snapshot.forEach(
          (item) => {

            const data =
              item.data();


            classSessions.push({

              id:
                item.id,

              studentId:
                data.studentId,

              subject:
                data.subject,

              minutes:
                Number(
                  data.minutes
                ) || 0,

              date:
                data.date

            });

          }
        );


        updateRankings();

      },

      (error) => {

        console.error(
          "ランキング記録取得エラー:",
          error
        );

      }

    );

}

onAuthStateChanged(

      button.disabled =

      /* =========================

        await setDoc(

          doc(
            db,
            "students",
            user.uid
          ),

          {

            nickname:
              name,

            classId:
              CLASS_ID

          },

          {

            merge:
              true

          }

        );

      } catch (error) {

        console.error(
          "students登録エラー:",
          error
        );

      }


      /* =========================
         onlineUsers登録
      ========================= */

      try {

        await setDoc(

          doc(
            db,
            "onlineUsers",
            user.uid
          ),

          {

            nickname:
              name,

            lastActive:
              serverTimestamp()

          },

          {

            merge:
              true

          }

        );

      } catch (error) {

        console.error(
          "onlineUsers登録エラー:",
          error
        );

      }


      /* =========================
         自分の記録
      ========================= */

      listenToMyRecords(

      );


      /* =========================
         クラスランキング
      ========================= */

      listenToRankings(
        user
      );

    }

  }
);

/* =========================
   手入力で記録
========================= */

window.addRecord =
  async function () {

    const user =
      auth.currentUser;


    if (!user) {

      alert(
        "先にGoogleログインしてください！"
      );

      return;

    }


    const subject =
      document.getElementById(
        "subject"
      ).value;


    const minutes =
      Number(
        document.getElementById(
          "minutes"
        ).value
      );


    if (
      !minutes ||
      minutes <= 0
    ) {

      alert(
        "勉強時間を入力してください！"
      );

      return;

    }


    try {

      await addDoc(

        collection(
          db,
          "studySessions"
        ),

        {

          studentId:
            user.uid,

          subject:
            subject,

          minutes:
            minutes,

          date:
            serverTimestamp()

        }

      );


      document.getElementById(
        "minutes"
      ).value =
        "";


      alert(
        "Firebaseに保存しました！"
      );


    } catch (error) {

      console.error(
        error
      );


      alert(
        "保存できませんでした。\n" +
        error.code +
        "\n" +
        error.message
      );

    }

  };


/* =========================
   1件削除
========================= */

async function deleteRecord(
  recordId
) {

  const user =
    auth.currentUser;


  if (!user) {

    alert(
      "先にGoogleログインしてください！"
    );

    return;

  }


  const ok =
    confirm(
      "この記録を削除しますか？"
    );


  if (!ok) {

    return;

  }


  try {

    await deleteDoc(

      doc(
        db,
        "studySessions",
        recordId
      )

    );

  } catch (error) {

    console.error(
      error
    );


    alert(
      "削除できませんでした。\n" +
      error.message
    );

  }

}


/* =========================
   すべて削除
========================= */

window.clearAll =
  async function () {

    const user =
      auth.currentUser;


    if (!user) {

      alert(
        "先にGoogleログインしてください！"
      );

      return;

    }


    const ok =
      confirm(
        "自分の記録をすべて削除しますか？"
      );


    if (!ok) {

      return;

    }


    try {

      const recordsQuery =
        query(

          collection(
            db,
            "studySessions"
          ),

          where(
            "studentId",
            "==",
            user.uid
          )

        );


      const snapshot =
        await getDocs(
          recordsQuery
        );


      for (
        const item
        of snapshot.docs
      ) {

        await deleteDoc(
          item.ref
        );

      }


      alert(
        "記録を削除しました！"
      );


    } catch (error) {

      console.error(
        error
      );


      alert(
        "削除できませんでした。\n" +
        error.message
      );

    }

  };
