<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習時間アプリ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: #f5f7fb;
  color: #222;
}

header {
  background: #4f7cff;
  color: white;
  padding: 24px 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

.container {
  max-width: 700px;
  margin: 20px auto;
  padding: 0 15px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2 {
  margin-top: 0;
  font-size: 20px;
}

input, select, button {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 16px;
}

button {
  border: none;
  background: #4f7cff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.summary-box {
  background: #f0f4ff;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
}

.summary-number {
  font-size: 25px;
  font-weight: bold;
  margin-top: 5px;
}

.record {
  border-bottom: 1px solid #eee;
  padding: 12px 0;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.record:last-child {
  border-bottom: none;
}

.delete {
  width: auto;
  padding: 7px 10px;
  background: #e74c3c;
  font-size: 13px;
  margin: 0;
}

.bar {
  margin: 12px 0;
}

.bar-label {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}

.bar-background {
  height: 18px;
  background: #e9edf5;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 5px;
}

.bar-fill {
  height: 100%;
  background: #4f7cff;
  border-radius: 10px;
}

.empty {
  text-align: center;
  color: #888;
  padding: 20px;
}

@media (max-width: 500px) {
  header h1 {
    font-size: 22px;
  }

  .card {
    padding: 16px;
  }

  .summary {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>📚 学習時間</h1>
  <p>毎日の勉強を記録しよう！</p>
</header>

<div class="container">
  <div class="card">
  <h2>🔐 ログイン</h2>
  <button onclick="loginWithGoogle()">Googleでログイン</button>
  <p id="loginStatus">ログインしていません</p>
</div>

  <div class="card">
    <h2>📝 勉強時間を記録</h2>

    <label>科目</label>
    <select id="subject">
      <option value="国語">国語</option>
      <option value="数学">数学</option>
      <option value="英語">英語</option>
      <option value="理科">理科</option>
      <option value="社会">社会</option>
      <option value="その他">その他</option>
    </select>

    <label>勉強時間（分）</label>
    <input type="number" id="minutes" min="1" placeholder="例：60">

    <button onclick="addRecord()">記録する</button>
  </div>

  <div class="card">
    <h2>📊 今日のまとめ</h2>

    <div class="summary">
      <div class="summary-box">
        今日の時間
        <div class="summary-number" id="todayTotal">0分</div>
      </div>

      <div class="summary-box">
        記録数
        <div class="summary-number" id="recordCount">0</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>📈 科目別</h2>
    <div id="subjectChart"></div>
  </div>

  <div class="card">
    <h2>📅 記録一覧</h2>
    <div id="records"></div>
  </div>

  <div class="card">
    <button onclick="clearAll()" style="background:#777;">
      すべての記録を削除
    </button>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
  import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCJH9rm_ygt9xbuIDdZDuAXEgy_Rsdlxz4",
    authDomain: "studytime11111-9c9f1.firebaseapp.com",
    projectId: "studytime11111-9c9f1",
    storageBucket: "studytime11111-9c9f1.firebasestorage.app",
    messagingSenderId: "292063415300",
    appId: "1:292063415300:web:3cbf0aef215710ecfd3951"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  

const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.loginWithGoogle = async function () {
  try {
    const result = await signInWithPopup(auth, provider);

    document.getElementById("loginStatus").textContent =
      "ログイン中：" + result.user.displayName;

    alert("Googleログインしました！");
  } catch (error) {
    console.error(error);
    alert("Googleログインに失敗しました。");
  }
};

  window.addRecord = async function () {

    const subject = document.getElementById("subject").value;
    const minutes = Number(document.getElementById("minutes").value);

    if (!minutes || minutes <= 0) {
      alert("勉強時間を入力してください！");
      return;
    }

    try {
      await addDoc(collection(db, "studySessions"), {
        studentId: "MwgOSaEOm5zbvFdTE1Ko",
        subject: subject,
        minutes: minutes,
        date: serverTimestamp()
      });

      document.getElementById("minutes").value = "";

      alert("Firebaseに保存しました！");

    } catch (error) {
      console.error(error);
      alert("保存できませんでした。Firestoreのルールを確認してください。");
    }
  };
</script>

</body>
</html>
