<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習時間アプリ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: #f5f7fb;
  color: #222;
}

header {
  background: #4f7cff;
  color: white;
  padding: 24px 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

.container {
  max-width: 700px;
  margin: 20px auto;
  padding: 0 15px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2 {
  margin-top: 0;
  font-size: 20px;
}

input, select, button {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 16px;
}

button {
  border: none;
  background: #4f7cff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

button:disabled {
  opacity: 0.6;
}

.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.summary-box {
  background: #f0f4ff;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
}

.summary-number {
  font-size: 25px;
  font-weight: bold;
  margin-top: 5px;
}

.record {
  border-bottom: 1px solid #eee;
  padding: 12px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.record:last-child {
  border-bottom: none;
}

.record-info {
  flex: 1;
}

.record-date {
  font-size: 13px;
  color: #888;
  margin-top: 4px;
}

.delete {
  width: auto;
  padding: 7px 10px;
  background: #e74c3c;
  font-size: 13px;
  margin: 0;
}

.bar {
  margin: 12px 0;
}

.bar-label {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}

.bar-background {
  height: 18px;
  background: #e9edf5;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 5px;
}

.bar-fill {
  height: 100%;
  background: #4f7cff;
  border-radius: 10px;
}

.empty {
  text-align: center;
  color: #888;
  padding: 20px;
}

@media (max-width: 500px) {
  header h1 {
    font-size: 22px;
  }

  .card {
    padding: 16px;
  }

  .summary {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>📚 学習時間</h1>
  <p>毎日の勉強を記録しよう！</p>
</header>

<div class="container">

  <!-- ログイン -->
  <div class="card">
    <h2>🔐 ログイン</h2>

    <button id="loginButton" onclick="loginWithGoogle()">
      Googleでログイン
    </button>

    <p id="loginStatus">ログインしていません</p>
  </div>


  <!-- 勉強時間を記録 -->
  <div class="card">
    <h2>📝 勉強時間を記録</h2>

    <label>科目</label>

    <select id="subject">
      <option value="国語">国語</option>
      <option value="数学">数学</option>
      <option value="英語">英語</option>
      <option value="理科">理科</option>
      <option value="社会">社会</option>
      <option value="その他">その他</option>
    </select>

    <label>勉強時間（分）</label>

    <input
      type="number"
      id="minutes"
      min="1"
      placeholder="例：60"
    >

    <button onclick="addRecord()">
      記録する
    </button>
  </div>


  <!-- 今日のまとめ -->
  <div class="card">
    <h2>📊 今日のまとめ</h2>

    <div class="summary">

      <div class="summary-box">
        今日の時間
        <div class="summary-number" id="todayTotal">
          0分
        </div>
      </div>

      <div class="summary-box">
        記録数
        <div class="summary-number" id="recordCount">
          0
        </div>
      </div>

    </div>
  </div>


  <!-- 科目別 -->
  <div class="card">
    <h2>📈 科目別</h2>
    <div id="subjectChart"></div>
  </div>


  <!-- 記録一覧 -->
  <div class="card">
    <h2>📅 記録一覧</h2>
    <div id="records">
      <div class="empty">
        ログインすると記録が表示されます
      </div>
    </div>
  </div>


  <!-- 削除 -->
  <div class="card">

    <button
      onclick="clearAll()"
      style="background:#777;"
    >
      すべての記録を削除
    </button>

  </div>

</div>


<script type="module">

/* =========================
   Firebase
========================= */

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  doc,
  setDoc,
  deleteDoc,
  query,
  where,
  onSnapshot
}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged
}
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================
   Firebase設定
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyCJH9rm_ygt9xbuIDdZDuAXEgy_Rsdlxz4",
  authDomain: "studytime11111-9c9f1.firebaseapp.com",
  projectId: "studytime11111-9c9f1",
  storageBucket: "studytime11111-9c9f1.firebasestorage.app",
  messagingSenderId: "292063415300",
  appId: "1:292063415300:web:3cbf0aef215710ecfd3951"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();


/* =========================
   クラスID
========================= */

const CLASS_ID = "z6bxH8sYFjcdfENFXn3K";


/* =========================
   Googleログイン
========================= */

window.loginWithGoogle = async function () {

  try {

    await signInWithRedirect(auth, provider);

  } catch (error) {

    console.error(error);

    alert(
      "Googleログインに失敗しました。\n" +
      error.code + "\n" +
      error.message
    );

  }

};


/* =========================
   記録を表示
========================= */

function showRecords(snapshot) {

  const recordsElement =
    document.getElementById("records");

  const todayTotalElement =
    document.getElementById("todayTotal");

  const recordCountElement =
    document.getElementById("recordCount");

  const chartElement =
    document.getElementById("subjectChart");


  let records = [];

  snapshot.forEach((item) => {

    const data = item.data();

    records.push({
      id: item.id,
      subject: data.subject || "その他",
      minutes: Number(data.minutes) || 0,
      date: data.date
    });

  });


  /* 新しい順 */

  records.sort((a, b) => {

    const timeA =
      a.date && a.date.toDate
        ? a.date.toDate().getTime()
        : 0;

    const timeB =
      b.date && b.date.toDate
        ? b.date.toDate().getTime()
        : 0;

    return timeB - timeA;

  });


  /* =========================
     今日の合計
  ========================= */

  const now = new Date();

  let todayTotal = 0;

  records.forEach((record) => {

    if (!record.date || !record.date.toDate) {
      return;
    }

    const date = record.date.toDate();

    if (
      date.getFullYear() === now.getFullYear() &&
      date.getMonth() === now.getMonth() &&
      date.getDate() === now.getDate()
    ) {

      todayTotal += record.minutes;

    }

  });


  todayTotalElement.textContent =
    todayTotal + "分";


  recordCountElement.textContent =
    records.length;


  /* =========================
     科目別集計
  ========================= */

  const subjects = {
    "国語": 0,
    "数学": 0,
    "英語": 0,
    "理科": 0,
    "社会": 0,
    "その他": 0
  };


  records.forEach((record) => {

    if (subjects[record.subject] !== undefined) {

      subjects[record.subject] += record.minutes;

    }

  });


  const maxMinutes =
    Math.max(...Object.values(subjects), 1);


  chartElement.innerHTML = "";


  Object.entries(subjects).forEach(
    ([subject, minutes]) => {

      const bar =
        document.createElement("div");

      bar.className = "bar";


      const label =
        document.createElement("div");

      label.className = "bar-label";

      label.innerHTML =
        "<span>" +
        subject +
        "</span>" +
        "<span>" +
        minutes +
        "分</span>";


      const background =
        document.createElement("div");

      background.className =
        "bar-background";


      const fill =
        document.createElement("div");

      fill.className =
        "bar-fill";


      fill.style.width =
        (minutes / maxMinutes * 100) + "%";


      background.appendChild(fill);

      bar.appendChild(label);

      bar.appendChild(background);

      chartElement.appendChild(bar);

    }
  );


  /* =========================
     記録一覧
  ========================= */

  recordsElement.innerHTML = "";


  if (records.length === 0) {

    recordsElement.innerHTML =
      '<div class="empty">まだ記録がありません</div>';

    return;

  }


  records.forEach((record) => {

    const recordElement =
      document.createElement("div");

    recordElement.className =
      "record";


    const info =
      document.createElement("div");

    info.className =
      "record-info";


    let dateText = "日時不明";


    if (record.date && record.date.toDate) {

      const date =
        record.date.toDate();


      dateText =
        date.toLocaleString("ja-JP");

    }


    info.innerHTML =
      "<strong>" +
      record.subject +
      "</strong>　" +
      record.minutes +
      "分" +
      '<div class="record-date">' +
      dateText +
      "</div>";


    const deleteButton =
      document.createElement("button");

    deleteButton.textContent =
      "削除";

    deleteButton.className =
      "delete";


    deleteButton.onclick =
      () => deleteRecord(record.id);


    recordElement.appendChild(info);

    recordElement.appendChild(deleteButton);

    recordsElement.appendChild(recordElement);

  });

}


/* =========================
   自分の記録をリアルタイム取得
========================= */

function listenToMyRecords(user) {

  const recordsQuery =
    query(
      collection(db, "studySessions"),
      where("studentId", "==", user.uid)
    );


  onSnapshot(
    recordsQuery,
    (snapshot) => {

      showRecords(snapshot);

    },
    (error) => {

      console.error(
        "記録読み込みエラー:",
        error
      );

    }
  );

}


/* =========================
   ログイン状態
========================= */

onAuthStateChanged(auth, async (user) => {

  const status =
    document.getElementById("loginStatus");

  const button =
    document.getElementById("loginButton");


  if (user) {

    const name =
      user.displayName || "Googleユーザー";


    /* 名前を表示 */

    status.textContent =
      "👤 " + name + " さんでログイン中";


    button.textContent =
      "ログイン済み";


    button.disabled = true;


    /* =========================
       studentsに自動登録
    ========================= */

    try {

      await setDoc(
        doc(db, "students", user.uid),
        {
          nickname: name,
          classId: CLASS_ID
        },
        {
          merge: true
        }
      );

    } catch (error) {

      console.error(
        "students登録エラー:",
        error
      );

    }


    /* =========================
       自分の記録を読み込む
    ========================= */

    listenToMyRecords(user);

  }

});


/* =========================
   リダイレクト後の確認
========================= */

try {

  await getRedirectResult(auth);

} catch (error) {

  console.error(
    "ログイン結果エラー:",
    error
  );

  alert(
    "Googleログインでエラーが発生しました。\n" +
    error.code + "\n" +
    error.message
  );

}


/* =========================
   勉強時間を記録
========================= */

window.addRecord = async function () {

  const user = auth.currentUser;


  if (!user) {

    alert(
      "先にGoogleログインしてください！"
    );

    return;

  }


  const subject =
    document.getElementById("subject").value;


  const minutes =
    Number(
      document.getElementById("minutes").value
    );


  if (!minutes || minutes <= 0) {

    alert(
      "勉強時間を入力してください！"
    );

    return;

  }


  try {

    await addDoc(
      collection(db, "studySessions"),
      {
        studentId: user.uid,
        subject: subject,
        minutes: minutes,
        date: serverTimestamp()
      }
    );


    document.getElementById(
      "minutes"
    ).value = "";


    alert(
      "Firebaseに保存しました！"
    );


  } catch (error) {

    console.error(error);

    alert(
      "保存できませんでした。\n" +
      error.code + "\n" +
      error.message
    );

  }

};


/* =========================
   1件削除
========================= */

async function deleteRecord(recordId) {

  const user = auth.currentUser;


  if (!user) {

    alert(
      "先にGoogleログインしてください！"
    );

    return;

  }


  const ok =
    confirm(
      "この記録を削除しますか？"
    );


  if (!ok) return;


  try {

    await deleteDoc(
      doc(db, "studySessions", recordId)
    );


  } catch (error) {

    console.error(error);

    alert(
      "削除できませんでした。\n" +
      error.message
    );

  }

}


/* =========================
   すべて削除
========================= */

window.clearAll = async function () {

  const user = auth.currentUser;


  if (!user) {

    alert(
      "先にGoogleログインしてください！"
    );

    return;

  }


  const ok =
    confirm(
      "自分の記録をすべて削除しますか？"
    );


  if (!ok) return;


  try {

    const recordsQuery =
      query(
        collection(db, "studySessions"),
        where("studentId", "==", user.uid)
      );


    const unsubscribe =
      onSnapshot(
        recordsQuery,
        async (snapshot) => {

          for (const item of snapshot.docs) {

            await deleteDoc(item.ref);

          }

          unsubscribe();

          alert(
            "記録を削除しました！"
          );

        }
      );


  } catch (error) {

    console.error(error);

    alert(
      "削除できませんでした。\n" +
      error.message
    );

  }

};

</script>

</body>
</html>
