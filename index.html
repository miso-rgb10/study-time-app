<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勉強時間管理</title>
</head>

<body>
  <h1>📚 勉強時間管理</h1>

  <h2 id="timer">00:00:00</h2>

  <button id="start">勉強開始</button>
  <button id="stop">一時停止</button>
  <button id="reset">リセット</button>

  <p id="status">現在：勉強していません</p>

  <script>
    let startTime = null;
    let elapsedTime = 0;
    let timer = null;

    function updateTimer() {
      const total = elapsedTime + (Date.now() - startTime);

      const h = Math.floor(total / 3600000);
      const m = Math.floor((total % 3600000) / 60000);
      const s = Math.floor((total % 60000) / 1000);

      document.getElementById("timer").textContent =
        String(h).padStart(2, "0") + ":" +
        String(m).padStart(2, "0") + ":" +
        String(s).padStart(2, "0");
    }

    document.getElementById("start").onclick = () => {
      if (timer !== null) return;

      startTime = Date.now();
      timer = setInterval(updateTimer, 1000);
      document.getElementById("status").textContent = "現在：勉強中 📖";
    };

    document.getElementById("stop").onclick = () => {
      if (timer === null) return;

      elapsedTime += Date.now() - startTime;
      clearInterval(timer);
      timer = null;
      updateTimer();

      document.getElementById("status").textContent = "現在：一時停止中";
    };

    document.getElementById("reset").onclick = () => {
      clearInterval(timer);

      timer = null;
      startTime = null;
      elapsedTime = 0;

      document.getElementById("timer").textContent = "00:00:00";
      document.getElementById("status").textContent = "現在：勉強していません";
    };
  </script>
</body>
</html>
